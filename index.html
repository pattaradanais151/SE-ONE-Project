    <style>

      .loader-logo img {
        width: 100%;

        object-fit: contain; /* รักษาอัตราส่วนรูปภาพไม่ให้เบี้ยว */
      }
      .loader-spinner {

      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 113, 227, 0.2); }

      /* ซ่อน Loader เมื่อ React โหลดเสร็จ */

      /* Toast แจ้งเตือนการอัปเดตเวอร์ชันใหม่ (สร้างโดยสคริปต์ PWA ด้านล่าง) */
      #se-toast {

        -webkit-backdrop-filter: blur(16px);

      #se-toast.show { opacity: 1; transform: translate(-50%, 0); }
      #se-toast .dot {
        flex: none;

        border-radius: 50%;

    <!-- Script สำหรับซ่อน Loader ทันทีที่โหลดเสร็จ -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
          setTimeout(() => {
            const loader = document.getElementById('initial-loader');
            if (loader) loader.remove();

        }, 100);

    </script>
    <script>
    (() => {
      'use strict';

      /* ======================= CONFIG ======================= */
      const CFG = {
        SW_URL: '/sw.js',
        WS_URL: 'wss://ws.seone.site',   // TODO: เปลี่ยนเป็น WebSocket endpoint จริง (ใส่ '' เพื่อปิด)
        POLL_MS_NO_WS: 60 * 1000,        // ไม่มี WS → เช็คทุก 1 นาที
        POLL_MS_WITH_WS: 5 * 60 * 1000,  // มี WS → เช็คสำรองทุก 5 นาที
        WS_RETRIES: 6,                   // ถูกสั่งอัปเดตจาก WS → ลองเช็คซ้ำ (รอ CDN กระจายไฟล์ใหม่)
        WS_RETRY_MS: 5000,
        WS_PING_MS: 25 * 1000,
        WS_MAX_BACKOFF_MS: 60 * 1000,
        WS_MAX_FAILS: 8,                 // ต่อไม่ติดติดต่อกันเกินนี้ → หยุดจนกว่าผู้ใช้กลับมาที่แท็บ/ออนไลน์
        RELOAD_DELAY_MS: 2000,           // เวลาให้ผู้ใช้เห็น Toast ก่อน reload
        GUARD_RETRY_MS: 5000,            // ถ้ากำลังมีงานค้าง รอแล้วเช็คใหม่ทุกกี่ ms
        DEBUG: false
      };

      const hasSW = 'serviceWorker' in navigator;
      const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      let reg = null;
      let updating = false;
      let hadController = hasSW && !!navigator.serviceWorker.controller;

      const log = (...a) => { if (CFG.DEBUG && window.console) console.log('[SE]', ...a); };
      const emit = (name, detail) => {
        try { window.dispatchEvent(new CustomEvent(name, { detail })); } catch (e) {}
      };
      const track = (name, params) => {
        try { if (typeof window.gtag === 'function') window.gtag('event', name, params || {}); } catch (e) {}
      };

      /* ======================= TOAST ======================= */
      function showToast(msg) {
        let el = document.getElementById('se-toast');
        if (!el) {
          el = document.createElement('div');
          el.id = 'se-toast';
          el.setAttribute('role', 'status');
          el.setAttribute('aria-live', 'polite');
          el.innerHTML = '<span class="dot"></span><span class="msg"></span>';
          document.body.appendChild(el);
        }
        el.querySelector('.msg').textContent = msg;
        void el.offsetWidth; // force reflow ให้ transition ทำงาน
        el.classList.add('show');
      }

      /* ================= UPDATE (Realtime reload) ================= */
      // ให้ React ตั้งค่าได้ เช่น window.SE_UPDATE_GUARD = () => hasUnsavedCode;
      // ถ้า return true จะรอจนกว่างานจะเสร็จก่อนค่อย reload (กันโค้ดใน Web IDE หาย)
      const isBusy = () => {
        try { return typeof window.SE_UPDATE_GUARD === 'function' && window.SE_UPDATE_GUARD() === true; }
        catch (e) { return false; }
      };

      // กัน reload วนลูป (เช่น CDN ยังส่งไฟล์เก่า)
      const recentlyReloaded = () => {
        try { return Date.now() - Number(sessionStorage.getItem('se:reload-ts') || 0) < 30000; }
        catch (e) { return false; }
      };

      function applyUpdate(reason) {
        if (updating) return;
        if (recentlyReloaded()) { log('skip: reloaded < 30s ago'); return; }
        updating = true;
        log('apply update:', reason);
        track('pwa_update_applied', { reason });
        showToast('พบเวอร์ชันใหม่ กำลังอัปเดตอัตโนมัติ…');

        const tryReload = () => {
          if (isBusy()) {
            showToast('รอบันทึกงานก่อนอัปเดตเวอร์ชันใหม่…');
            setTimeout(tryReload, CFG.GUARD_RETRY_MS);
            return;
          }
          try { sessionStorage.setItem('se:reload-ts', String(Date.now())); } catch (e) {}
          location.reload();
        };
        setTimeout(tryReload, CFG.RELOAD_DELAY_MS);
      }

      // ไฟล์ entry ที่หน้าปัจจุบันใช้อยู่ (Vite production: /assets/index-xxxx.js) — dev จะเป็น null
      function currentEntry() {
        const s = document.querySelector('script[type="module"][src*="/assets/"]');
        return s ? new URL(s.getAttribute('src'), location.origin).pathname : null;
      }

      // ดึง index.html ล่าสุดจากเซิร์ฟเวอร์แล้วอ่านชื่อไฟล์ entry
      function fetchLatestEntry() {
        return fetch('/?_se=' + Date.now(), {
          cache: 'no-store',
          credentials: 'same-origin',
          headers: { Accept: 'text/html' }
        })
          .then((res) => (res.ok ? res.text() : ''))
          .then((html) => {
            const m = html.match(/<script[^>]*type="module"[^>]*src="([^"]*\/assets\/[^"]+)"/i);
            return m ? new URL(m[1], location.origin).pathname : null;
          });
      }

      function checkForUpdate(reason, retries) {
        if (updating) return;
        if (reg) reg.update().catch(() => {});       // sw.js เปลี่ยน → ติดตั้ง → controllerchange
        const cur = currentEntry();
        if (!cur || !navigator.onLine) return;
        fetchLatestEntry()
          .then((latest) => {
            if (latest && latest !== cur) return applyUpdate(reason);
            if (retries > 0) setTimeout(() => checkForUpdate(reason, retries - 1), CFG.WS_RETRY_MS);
          })
          .catch(() => {});
      }

      /* ================= SERVICE WORKER ================= */
      function registerSW() {
        if (!hasSW || isLocal) return;

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController) { hadController = true; return; } // ติดตั้งครั้งแรก ไม่ต้อง reload
          applyUpdate('sw-controller-change');
        });

        navigator.serviceWorker
          .register(CFG.SW_URL, { scope: '/', updateViaCache: 'none' })
          .then((r) => {
            reg = r;
            if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
            r.addEventListener('updatefound', () => {
              const nw = r.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  nw.postMessage({ type: 'SKIP_WAITING' }); // กันเหนียว (sw.js ก็ skipWaiting เองอยู่แล้ว)
                }
              });
            });
          })
          .catch((err) => log('SW register failed', err));
      }

      /* ================= PWA INSTALL PROMPT ================= */
      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();               // เก็บไว้ให้ปุ่ม "ติดตั้งแอป" ของเราเรียกเอง
        deferredPrompt = e;
        emit('se:pwa:installable', {});
      });
      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        track('pwa_installed');
        emit('se:pwa:installed', {});
      });
      const promptInstall = () => {
        if (!deferredPrompt) return Promise.resolve(null);
        const p = deferredPrompt;
        deferredPrompt = null;
        p.prompt();
        return p.userChoice;
      };

      /* ================= WEBSOCKET CLIENT ================= */
      let ws = null;
      let wsOpen = false;
      let wsFails = 0;
      let wsOpenedAt = 0;
      let wsManualClose = false;
      let wsReconnectTimer = null;
      let wsPingTimer = null;
      const wsHandlers = {};

      const wsStatus = (status) => emit('se:ws:status', { status });

      function wsSend(data) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return false;
        try { ws.send(typeof data === 'string' ? data : JSON.stringify(data)); return true; }
        catch (e) { return false; }
      }

      function wsRetryLater() {
        if (wsFails >= CFG.WS_MAX_FAILS) { log('ws: give up until user returns'); return; }
        const delay = Math.min(CFG.WS_MAX_BACKOFF_MS, 1000 * Math.pow(2, wsFails)) + Math.random() * 1000;
        clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(wsConnect, delay);
      }

      function wsConnect() {
        if (!CFG.WS_URL || !('WebSocket' in window)) return;
        if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
        if (wsFails >= CFG.WS_MAX_FAILS) return;

        clearTimeout(wsReconnectTimer);
        wsManualClose = false;
        wsOpenedAt = 0;

        try { ws = new WebSocket(CFG.WS_URL); }
        catch (e) { wsFails++; wsRetryLater(); return; }
        wsStatus('connecting');

        ws.onopen = () => {
          wsOpen = true;
          wsOpenedAt = Date.now();
          wsStatus('open');
          log('ws open');
          wsSend({ type: 'hello', app: 'se-one', build: currentEntry(), path: location.pathname });
          clearInterval(wsPingTimer);
          wsPingTimer = setInterval(() => wsSend({ type: 'ping', t: Date.now() }), CFG.WS_PING_MS);
        };

        ws.onmessage = (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch (e) { msg = { type: 'raw', data: ev.data }; }
          if (!msg || msg.type === 'pong') return;

          // เซิร์ฟเวอร์ประกาศ deploy ใหม่ → เช็คแล้วอัปเดตทันที
          if (msg.type === 'app-update' || msg.type === 'deploy') {
            checkForUpdate('ws', CFG.WS_RETRIES);
          }
          emit('se:ws:message', msg); // ให้ React ฟังผ่าน window.addEventListener('se:ws:message', ...)
          (wsHandlers[msg.type] || []).forEach((fn) => { try { fn(msg); } catch (e) {} });
        };

        ws.onerror = () => { /* onclose จะตามมาเอง */ };

        ws.onclose = () => {
          wsOpen = false;
          clearInterval(wsPingTimer);
          wsStatus('closed');
          // เชื่อมต่ออยู่นานพอ (>10s) ถือว่าเสถียร รีเซ็ตตัวนับ ไม่งั้นนับเป็นความล้มเหลว
          if (wsOpenedAt && Date.now() - wsOpenedAt > 10000) wsFails = 0; else wsFails++;
          if (!wsManualClose) wsRetryLater();
        };
      }

      // ผู้ใช้กลับมา/ออนไลน์ → ปลุกการเชื่อมต่อ
      const wsWake = () => {
        if (wsOpen) return;
        wsFails = 0;
        wsConnect();
      };

      /* ================= PUBLIC API (ใช้จาก React ได้) ================= */
      window.SE_WS = {
        send: wsSend,
        on(type, fn) { (wsHandlers[type] = wsHandlers[type] || []).push(fn); },
        off(type, fn) { wsHandlers[type] = (wsHandlers[type] || []).filter((f) => f !== fn); },
        connect: wsWake,
        close() {
          wsManualClose = true;
          clearTimeout(wsReconnectTimer);
          if (ws) ws.close(1000);
        },
        get connected() { return wsOpen; }
      };
      window.SE_PWA = {
        checkForUpdate: () => checkForUpdate('manual', 0),
        install: promptInstall,
        get installable() { return !!deferredPrompt; }
      };

      /* ================= TRIGGERS ================= */
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { checkForUpdate('visible', 0); wsWake(); }
      });
      window.addEventListener('online', () => { checkForUpdate('online', 0); wsWake(); });
      window.addEventListener('pageshow', (e) => { if (e.persisted) checkForUpdate('bfcache', 0); });

      const schedulePoll = () => {
        setTimeout(() => {
          if (!document.hidden) checkForUpdate('poll', 0);
          schedulePoll();
        }, wsOpen ? CFG.POLL_MS_WITH_WS : CFG.POLL_MS_NO_WS);
      };

      // เริ่มทำงานหลังหน้าโหลดเสร็จและเบราว์เซอร์ว่าง เพื่อไม่กระทบ LCP
      window.addEventListener('load', () => {
        const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 1500));
        idle(() => {
          registerSW();
          wsConnect();
          schedulePoll();
        }, { timeout: 4000 });
      });
